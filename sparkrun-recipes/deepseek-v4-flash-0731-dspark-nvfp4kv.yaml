# DeepSeek V4 Flash 0731 + DSpark + 1M ctx, TP=2, on the spark1/spark2 cluster.
# THIS IS THE DEPLOYED RECIPE. Vendored verbatim from the live copy on spark1 at
# ~/.config/sparkrun/services/sparkrun-deepseek/recipe.yaml, which is what
# sparkrun-deepseek.service runs. Keep the two in sync (see README.md).
#
# Delta from the 2026-08-27 original:
#   - num_speculative_tokens 3 -> 5   (upstream retracted all k=3 guidance)
#   - pre_exec step 3 added: applies tonyd2wild Patch 5 (0005-suppress-stops-in-
#     reasoning) so client stop strings can't truncate a response mid-<think>.
#   - 2026-09-10: Patch 5 pin bumped 0fec8084 -> 43201d1c (OUTPUT-SIDE ARMING
#     revision, "Extended-by: Mcray4"). The old pin only armed when <think> was
#     in the PROMPT; the model can also open <think> as its first OUTPUT token
#     (templates that ignore the thinking kwarg), and the old guard missed that
#     -- upstream measured a 0731 derivative dying at 90 tokens with empty
#     content+reasoning on a stop-string request. New version is a strict
#     superset. Sentinel grep tightened to `_reasoning_pending` (output-side
#     specific) so it doesn't false-positive on the old prompt-side patch.
#
# ponytail: kv_cache_dtype stays fp8 even though the recipe name / metadata say
# nvfp4. Prod deliberately runs fp8 KV. Flip to nvfp4_ds_mla only if you hit 1M
# context pressure and are ready to re-benchmark stability -- separate change.
# ponytail: the dspark-overlay pre_exec is an escaped one-liner inherited from
# the sparkrun export. Left as-is; readability isn't worth a re-derivation risk
# on the sole inference backend.
recipe_version: '2'
model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: vllm
min_nodes: 2
max_nodes: 2
container: ghcr.io/bjk110/vllm-spark@sha256:d8492e7677cf1b9aaa3344e0e6865efc468454013eee5ebabac85be90af027be
metadata:
  description: 'DeepSeek V4 Flash 0731 (official release) with DSpark speculative
    decoding on 2x DGX Spark (TP=2): 1M-token context, 4-bit nvfp4_ds_mla KV cache,
    B12X MoE, draft-loader Patch 4. Upstream-measured ~55 tok/s mean / 66 peak by
    content (78 peak-finder). Port of tonyd2wild/DeepSeek-v4-Flash-0731-DSpark-1M-NVFP4-KV-2x-DGX-Spark.'
  maintainer: tonyd2wild
  category: agent
  kv_dtype: nvfp4
  model_dtype: fp8
  num_layers: 43
  num_kv_heads: 1
  head_dim: 512
  quantization: fp8
  quant_bits: 8
  model_type: deepseek_v4
  kv_lora_rank: 448
  qk_rope_head_dim: 64
  compress_ratios:
  - 0
  - 0
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 128
  - 4
  - 0
  - 0
  - 0
  index_head_dim: 128
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.78
  max_model_len: 1048576
  max_num_batched_tokens: 8192
  max_num_seqs: 12
  served_model_name: deepseek-v4-flash-0731
  tool_call_parser: deepseek_v4
  pipeline_parallel: 1
  kv_cache_dtype: fp8
  block_size: 256
  tokenizer_mode: deepseek_v4
  reasoning_parser: deepseek_v4
  speculative_config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}'
  long_prefill_token_threshold: 1024
  reasoning_config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
  chat_template_kwargs: '{"thinking":false}'
env:
  PYTHONUNBUFFERED: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '3600'
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  VLLM_TRITON_MLA_SPARSE: '1'
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: '256'
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
  VLLM_SKIP_INIT_MEMORY_CHECK: '1'
  VLLM_CACHE_ROOT: /cache/huggingface/sr-cache/vllm
  FLASHINFER_WORKSPACE_BASE: /cache/huggingface/sr-cache/vllm
  FLASHINFER_CUBIN_DIR: /cache/huggingface/sr-cache/flashinfer-cubin
  DG_JIT_CACHE_DIR: /cache/huggingface/sr-cache/deepgemm
  TILELANG_CACHE_DIR: /cache/huggingface/sr-cache/tilelang
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/sr-cache/inductor
  TRITON_CACHE_DIR: /cache/huggingface/sr-cache/triton
  TORCH_EXTENSIONS_DIR: /cache/huggingface/sr-cache/torch-ext
  HF_HUB_DISABLE_XET: '1'
  VLLM_USE_FLASHINFER_SAMPLER: '1'
  VLLM_USE_B12X_MOE: '1'
  VLLM_USE_B12X_WO_PROJECTION: '1'
  VLLM_USE_B12X_MHC: '1'
  VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: '0'
  VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: '16'
  B12X_W4A16_TC_DECODE: '0'
  VLLM_DSPARK_CONFIDENCE_THRESHOLD: '0.0'
  VLLM_DSPARK_CONFIDENCE_SCHEDULER: 'off'
  VLLM_DSPARK_LOCAL_ARGMAX: '1'
  VLLM_DSPARK_REPLICATE_MARKOV_W1: '1'
  VLLM_DSPARK_FUSED_MARKOV_ARGMAX: '0'
  VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: '1'
  VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: '0'
  VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: '1'
  VLLM_DSV4_B12X_COMPRESSED_MLA: '0'
  VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: '0'
  VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT: '0'
  DSPARK_SLOT_CLAMP: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  TILELANG_CLEANUP_TEMP_FILES: '1'
  DG_JIT_USE_NVRTC: '0'
  DG_JIT_NVCC_COMPILER: /opt/env/bin/nvcc
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_CUMEM_ENABLE: '0'
  NCCL_NVLS_ENABLE: '0'
pre_exec:
- |
  if [ ! -x /usr/bin/kill ] && [ ! -x /bin/kill ] && [ ! -x /usr/local/bin/kill ]; then
    printf '#!/bin/bash\nbuiltin kill "$@"\n' > /usr/local/bin/kill
    chmod +x /usr/local/bin/kill
    echo "[dspark-overlay] installed /usr/local/bin/kill shim (image has no kill binary)"
  fi
- "set -eu\nVLLM_ROOT=/opt/env/lib/python3.12/site-packages/vllm\nSRC=/tmp/dspark-overlay-src\n\
  COMMIT=d728faee9f5a8d5ebafe7bc44bca6c5d8d0d192f\nif [ -e \"$VLLM_ROOT/.sparkrun-dspark-overlay-$COMMIT\"\
  \ ]; then\n  echo \"[dspark-overlay] already applied, skipping\"\n  exit 0\nfi\n\
  echo \"[dspark-overlay] fetching tonyd2wild recipe @ $COMMIT\"\nrm -rf \"$SRC\"\
  \ /tmp/dspark-overlay.tar.gz\nmkdir -p \"$SRC\"\n/opt/env/bin/python -c \"import\
  \ sys,urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])\" \\\n\
  \  \"https://codeload.github.com/tonyd2wild/DeepSeek-v4-Flash-0731-DSpark-1M-NVFP4-KV-2x-DGX-Spark/tar.gz/$COMMIT\"\
  \ \\\n  /tmp/dspark-overlay.tar.gz\ntar -xzf /tmp/dspark-overlay.tar.gz -C \"$SRC\"\
  \ --strip-components=1\necho \"[dspark-overlay] applying base DSpark overlay files\"\
  \ncp -a \"$SRC/recipe/overlay/vllm/.\" \"$VLLM_ROOT/\"\nfor stage in a b c; do\n\
  \  echo \"[dspark-overlay] applying nvfp4 stage-$stage patch\"\n  sed -n \"/<<'PY'/,/^PY$/p\"\
  \ \"$SRC/recipe/nvfp4/Dockerfile.stage-$stage\" | sed '1d;$d' | /opt/env/bin/python\
  \ -\ndone\n# NOTE: upstream's apply-nonuniform-guard.py is intentionally NOT run.\n\
  # It exists for foreign prebuilt images whose proposer lacks the\n# concurrency\
  \ fix; this overlay's proposer handles non-uniform batches\n# natively, and stacking\
  \ the guard on top of it short-circuits that path\n# into always-rejected dummy\
  \ drafts (\"Drafted: N, Accepted: 0\").\necho \"[dspark-overlay] verifying Patch\
  \ 3 (cold-prefill garble fix) is present\"\ngrep -q \"is_prefill_chunk\" \"$VLLM_ROOT/v1/core/sched/scheduler.py\"\
  \ \\\n  || { echo \"[dspark-overlay] FATAL: Patch 3 missing \u2014 cold prefills\
  \ would garble\"; exit 1; }\necho \"[dspark-overlay] verifying Patch 4 (draft shared-expert\
  \ loader fix) is present\"\ngrep -q \"shared_experts.gate_up_proj\" \"$VLLM_ROOT/v1/spec_decode/dspark.py\"\
  \ \\\n  || { echo \"[dspark-overlay] FATAL: Patch 4 missing \u2014 0731 would run\
  \ at half speed\"; exit 1; }\nfind \"$VLLM_ROOT\" -name __pycache__ -type d -prune\
  \ -exec rm -rf {} + || true\n/opt/env/bin/python -m py_compile \"$VLLM_ROOT/envs.py\"\
  \ \"$VLLM_ROOT/v1/core/sched/scheduler.py\" \"$VLLM_ROOT/v1/spec_decode/dspark.py\"\
  \ \"$VLLM_ROOT/v1/spec_decode/dspark_proposer.py\"\ntouch \"$VLLM_ROOT/.sparkrun-dspark-overlay-$COMMIT\"\
  \necho \"[dspark-overlay] done: runtime now equivalent to vllm-dspark-runtime:dspark-nvfp4-stage-c\
  \ @ $COMMIT\"\n"
- |
  set -eu
  VLLM_ROOT=/opt/env/lib/python3.12/site-packages/vllm
  DETOK="$VLLM_ROOT/v1/engine/detokenizer.py"
  COMMIT=43201d1c2f281d238b8fd65f0f7168118f83169c
  MARK="$VLLM_ROOT/.sparkrun-patch5-$COMMIT"
  if [ -e "$MARK" ] || grep -q "_reasoning_pending" "$DETOK" 2>/dev/null; then
    echo "[patch5] output-side-arming stop-in-reasoning guard already present, skipping"
    exit 0
  fi
  echo "[patch5] fetching 0005-suppress-stops-in-reasoning.patch @ $COMMIT"
  /opt/env/bin/python -c "import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" \
    "https://raw.githubusercontent.com/tonyd2wild/DeepSeek-v4-Flash-0731-DSpark-1M-NVFP4-KV-2x-DGX-Spark/$COMMIT/patches/0005-suppress-stops-in-reasoning.patch" \
    /tmp/patch5.patch
  if ( cd "$VLLM_ROOT/.." && /opt/env/bin/git apply -p1 --verbose /tmp/patch5.patch ); then
    find "$VLLM_ROOT/v1/engine" -name __pycache__ -type d -prune -exec rm -rf {} + || true
    /opt/env/bin/python -m py_compile "$DETOK"
    grep -q "_reasoning_pending" "$DETOK" || { echo "[patch5] FATAL: applied but output-side sentinel absent"; exit 1; }
    touch "$MARK"
    echo "[patch5] applied: client stop strings now dormant inside <think> (prompt-side AND output-side)"
  else
    echo "[patch5] WARNING: patch did not apply against this vllm tree -- shipping WITHOUT Patch 5"
  fi
command: |
  export PATH=/opt/env/bin:/opt/env/nvvm/bin:/opt/env/targets/sbsa-linux/nvvm/bin:$PATH &&
  export CUDA_HOME=/opt/env/targets/sbsa-linux CUDA_PATH=/opt/env/targets/sbsa-linux CUDAToolkit_ROOT=/opt/env/targets/sbsa-linux &&
  export LD_LIBRARY_PATH=/opt/env/lib:/opt/env/targets/sbsa-linux/lib:$LD_LIBRARY_PATH &&
  /opt/env/bin/vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --async-scheduling \
    --enable-chunked-prefill \
    --long-prefill-token-threshold {long_prefill_token_threshold} \
    --max-num-partial-prefills 1 \
    --speculative-config '{speculative_config}' \
    --tokenizer-mode {tokenizer_mode} \
    --distributed-executor-backend mp \
    --tool-call-parser {tool_call_parser} \
    --enable-auto-tool-choice \
    --reasoning-parser {reasoning_parser} \
    --reasoning-config '{reasoning_config}' \
    --default-chat-template-kwargs '{chat_template_kwargs}' \
    --generation-config vllm \
    --enable-flashinfer-autotune

