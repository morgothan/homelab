# The newsroom needs inspection and logs, never Docker mutations, exec, or file export.
global
    maxconn 64

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend docker_reads
    bind :2375
    acl read_method method GET
    acl ping_method method HEAD
    acl ping_path path_reg ^(/v[0-9]+\.[0-9]+)?/_ping$
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/(version|_ping|containers/json)$
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-f0-9]{64}/(json|logs)$
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/images/sha256:[a-f0-9]{64}/json$
    http-request deny deny_status 403 unless read_method read_path or ping_method ping_path
    default_backend engine

backend engine
    server docker /var/run/docker.sock
